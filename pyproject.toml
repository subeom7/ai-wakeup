[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-wakeup"
version = "0.1.0a1"
description = "Explicit, local wake-up schedules for paused Claude Code and Codex sessions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ai-wakeup contributors"}]
keywords = ["codex", "claude-code", "scheduler", "cli", "resume"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = []

[project.scripts]
ai-wakeup = "ai_wakeup.cli:main"

[project.urls]
Repository = "https://github.com/subeom7/ai-wakeup"
Issues = "https://github.com/subeom7/ai-wakeup/issues"

[tool.setuptools.packages.find]
include = ["ai_wakeup*"]
