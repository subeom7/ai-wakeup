name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install from this repository
        run: python -m pip install .
      - name: Unit and simulated process integration tests (no provider credentials)
        run: python -m unittest discover -s tests -v
      - name: Isolated simulated resume
        run: python -m ai_wakeup demo
      - name: Check packaging entry point
        run: ai-wakeup --version
